<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>SEIF Family —ㅤ </title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#111c30;--line:#26364f;--text:#f8fafc;--muted:#b8c5d8;--red:#dc2626;--white:#fff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1b3151,var(--bg) 60%);font-family:Tahoma,Arial,sans-serif;color:var(--text);display:grid;place-items:center;padding:20px}
main{width:min(100%,520px);background:rgba(17,28,48,.96);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 22px 70px #0006}
.brand{font-size:13px;color:#93c5fd;letter-spacing:.5px}.symbol{font-size:42px;margin:12px 0}h1{font-size:25px;margin:8px 0 14px}p{line-height:1.9;color:var(--muted);margin:10px 0}.notice{border:1px solid #465a78;background:#0b1628;padding:14px;border-radius:14px;margin:18px 0}.notice strong{color:#fff}.actions{display:flex;gap:12px;margin-top:22px}.actions button{flex:1;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer}.yes{background:var(--red);color:#fff}.no{background:#fff;color:#111827}.status{min-height:28px;margin-top:16px;color:#bfdbfe;font-weight:700}.small{font-size:12px;color:#93a4bc}.hidden{display:none}.check{display:flex;gap:10px;align-items:flex-start;margin-top:16px;color:#e2e8f0;line-height:1.7}.check input{margin-top:6px;accent-color:#dc2626;transform:scale(1.2)}button:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="brand">SEIF FAMILY · ㅤ</div>
  <div class="symbol" aria-hidden="true">📱</div>
  <h1>ㅤ</h1>
  <p>ㅤ.</p>
  <div class="notice">
    <p><strong>ㅤ:</strong></p>
    <p>• ㅤ.</p>
    <p>• ㅤ.</p>
    <p>• ㅤ.</p>
  </div>
  <label class="check"><input id="understood" type="checkbox"><span>ㅤ.</span></label>
  <div class="actions">
    <button class="yes" id="agree" type="button">ㅤ</button>
    <button class="no" id="cancel" type="button">ㅤㅤ</button>
  </div>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <p class="small">ㅤ.</p>
</main>
<script>
const understood=document.getElementById('understood');
const status=document.getElementById('status');
document.getElementById('agree').addEventListener('click',()=>{
 if(!understood.checked){status.textContent='ㅤ.';return;}
 status.textContent='ㅤ.';
});
document.getElementById('cancel').addEventListener('click',()=>{
 understood.checked=false;
 status.textContent='ㅤ.';
});
</script>
</body>
</html>
